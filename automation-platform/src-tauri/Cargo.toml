[package]
name = "automation-platform"
version = "0.2.0"
description = "Local desktop automation and case-management platform"
authors = ["Automation Platform"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "automation_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native folder picker for choosing a workspace.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source, so the application does not depend on
# whatever SQLite version happens to be installed on the machine.
rusqlite = { version = "0.37", features = ["bundled"] }
# Stable workspace identifiers that survive renaming and moving the folder.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Temporary directories for the workspace and scanner tests, so nothing ever
# runs against a real workspace.
tempfile = "3"
